<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0A0A10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="더코 — 한국 영화 명대사·명장면 퀴즈. 65개의 한국 영화 명대사와 명장면으로 즐기는 4지선다 퀴즈." />
<title>더코 — 한국 영화 명대사·명장면 퀴즈</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<main id="app">

  <!-- ───────────── 홈 ───────────── -->
  <section id="screen-home" class="screen active">
    <header class="home-head">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🎬</div>
        <div class="brand-text">
          <h1>더코</h1>
          <p>한국 영화 명대사·명장면 퀴즈</p>
        </div>
      </div>
      <div class="marquee" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </header>

    <div class="block">
      <div class="block-title"><span>모드 선택</span><em id="mode-desc">대사를 읽고 영화 맞히기</em></div>
      <div class="modes" id="mode-list" role="tablist" aria-label="퀴즈 모드"></div>
    </div>

    <div class="block">
      <div class="block-title"><span>장르 선택</span><em id="pool-count">10문제</em></div>
      <div class="genres" id="genre-list"></div>
    </div>

    <footer class="home-foot">
      <p id="total-line">총 65문제 · 한국 영화 65편의 한 줄</p>
      <button id="reset-stats" class="link-btn">기록 초기화</button>
    </footer>
  </section>

  <!-- ───────────── 퀴즈 ───────────── -->
  <section id="screen-quiz" class="screen">
    <header class="quiz-head">
      <button id="quit" class="icon-btn" aria-label="그만하기">←</button>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="q-index">1 / 10</span>
          <span id="q-genre">범죄·느와르</span>
        </div>
        <div class="progress-bar"><i id="progress-fill"></i></div>
      </div>
      <div id="combo" class="combo">🔥 0</div>
    </header>

    <div class="quiz-body">
      <div class="q-card" id="q-card">
        <div class="q-type" id="q-type">명대사 → 영화 맞추기</div>
        <div id="q-media" class="q-media"></div>
        <p class="q-ask" id="q-ask">이 대사의 영화는?</p>
      </div>

      <div class="hint-row">
        <button id="hint-btn" class="hint-btn">💡 힌트 보기 <span>1회</span></button>
        <p id="hint-text" class="hint-text" hidden></p>
      </div>

      <div id="options" class="options"></div>
      <div id="feedback" class="feedback" hidden></div>
    </div>

    <div class="quiz-foot">
      <button id="next-btn" class="primary" hidden>다음 문제 →</button>
    </div>
  </section>

  <!-- ───────────── 결과 ───────────── -->
  <section id="screen-result" class="screen">
    <div class="result-top">
      <div class="score-ring" id="score-ring">
        <div class="score-inner">
          <b id="r-score">0</b>
          <span>점</span>
        </div>
      </div>
      <p class="result-grade" id="r-grade">팝콘 관객</p>
      <p class="result-sub" id="r-sub">10문제 중 0문제 정답</p>
      <p class="result-best" id="r-best"></p>
    </div>

    <div class="result-actions">
      <button id="retry" class="primary">같은 조건으로 다시</button>
      <div class="row">
        <button id="home" class="ghost">다른 장르 도전</button>
        <button id="share" class="ghost">결과 공유</button>
      </div>
    </div>

    <div class="review-head">
      <span>틀린 문제 다시 보기</span>
      <em id="wrong-count"></em>
    </div>
    <div id="review" class="review"></div>
  </section>

</main>

<script>
  // 화면 검증용 오류 수집기 (사용자 화면에는 보이지 않음)
  window.__thekoErrors = [];
  window.addEventListener('error', function (e) { window.__thekoErrors.push(String(e.message || e)); });
  window.addEventListener('unhandledrejection', function (e) { window.__thekoErrors.push('rejection: ' + e.reason); });
</script>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
